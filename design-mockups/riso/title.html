<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Two-ink poster — title</title>
  <style>
    @font-face { font-family: "Poster"; font-weight: 700; src: url("../fonts/NotoSansDisplay-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Text"; font-weight: 600; src: url("../../site/vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Text"; font-weight: 400; src: url("../../site/vendor/fonts/inter-latin-400-normal.woff2") format("woff2"); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #f3ecdf; color: #10261c; font-family: Text, sans-serif; }
    .sheet { height: 100%; position: relative; overflow: hidden; padding: 36px 48px; }
    .dot {
      position: absolute;
      right: -80px;
      top: -90px;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background-image: radial-gradient(circle, #d84a1b 1.3px, transparent 1.45px);
      background-size: 9px 9px;
      transform: rotate(8deg);
    }
    .ghost {
      position: absolute;
      left: 52px;
      top: 118px;
      margin: 0;
      font-family: Poster, sans-serif;
      font-size: 118px;
      line-height: 0.82;
      letter-spacing: -0.03em;
      color: #1f6f8a;
      text-transform: uppercase;
    }
    h1 {
      position: relative;
      margin: 78px 0 0;
      font-family: Poster, sans-serif;
      font-size: 118px;
      line-height: 0.82;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #10261c;
    }
    .sub {
      position: relative;
      margin: 28px 0 0;
      max-width: 16ch;
      font-size: 32px;
      font-weight: 600;
      color: #d84a1b;
    }
    .stamp {
      position: absolute;
      right: 56px;
      bottom: 48px;
      width: 250px;
      padding: 12px 14px 14px;
      border: 3px solid #1f6f8a;
      color: #1f6f8a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      font-size: 16px;
      line-height: 1.35;
      transform: rotate(6deg);
    }
    .stamp b { display: block; font-family: Poster, sans-serif; font-size: 28px; letter-spacing: 0; text-transform: none; }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="dot" aria-hidden="true"></div>
    <p class="ghost" aria-hidden="true">Autoencoders<br />&amp; VAEs</p>
    <h1>Autoencoders<br />&amp; VAEs</h1>
    <p class="sub">teaching a network to imagine cats</p>
    <p class="stamp"><b>20 Oct 2026</b> Danish · MAAI901<br />Deep Learning for Visual Data</p>
  </main>
</body>
</html>
