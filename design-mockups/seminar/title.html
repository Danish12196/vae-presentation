<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Seminar sheet — title</title>
  <style>
    @font-face { font-family: "Display"; font-weight: 700; font-style: normal; src: url("../fonts/NotoSerifDisplay-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Display"; font-weight: 700; font-style: italic; src: url("../fonts/NotoSerifDisplay-BoldItalic.ttf") format("truetype"); }
    @font-face { font-family: "Text"; font-weight: 400; src: url("../../site/vendor/fonts/inter-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Text"; font-weight: 600; src: url("../../site/vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      color: #1c1612;
      font-family: Text, "Source Sans 3", sans-serif;
      background:
        radial-gradient(ellipse at 80% 0%, rgba(180, 80, 40, 0.08), transparent 42%),
        repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(28, 22, 18, 0.035) 28px),
        #f3ead7;
    }
    .sheet {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 42px 78px 36px 96px;
      border-left: 18px solid #b4332a;
    }
    .kicker {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 72px 0 0;
      max-width: 12ch;
      font-family: Display, "Noto Serif Display", serif;
      font-size: 96px;
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 22px 0 0;
      font-family: Display, serif;
      font-style: italic;
      font-size: 34px;
    }
    .note {
      margin: 48px 0 0;
      align-self: flex-start;
      transform: rotate(-1.4deg);
      color: #b4332a;
      font-family: Display, serif;
      font-style: italic;
      font-size: 28px;
      border-bottom: 1.5px solid #b4332a;
      padding-bottom: 2px;
    }
    footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(28, 22, 18, 0.4);
      padding-top: 14px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <p class="kicker">MAAI901 · Deep Learning for Visual Data</p>
    <h1>Autoencoders &amp; VAEs</h1>
    <p class="sub">teaching a network to imagine cats</p>
    <p class="note">The cats arrive on the next slide. This one is just the title.</p>
    <footer>
      <span>Danish</span>
      <span>Tuesday 20 October 2026</span>
      <span>Sheet 01</span>
    </footer>
  </main>
</body>
</html>
