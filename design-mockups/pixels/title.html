<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pixel training — title</title>
  <style>
    @font-face { font-family: "Poster"; font-weight: 700; src: url("../fonts/NotoSansDisplay-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Text"; font-weight: 600; src: url("../../site/vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Text"; font-weight: 400; src: url("../../site/vendor/fonts/inter-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Mono"; src: url("../../site/vendor/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #efe6d2; color: #24170f; font-family: Text, sans-serif; }
    .screen { height: 100%; padding: 22px 36px 18px; display: flex; flex-direction: column; border: 10px solid #24170f; }
    .hud { display: flex; justify-content: space-between; font-family: Mono, monospace; font-size: 16px; letter-spacing: 0.06em; }
    h1 { margin: 18px 0 0; font-family: Poster, sans-serif; font-size: 68px; line-height: 0.88; letter-spacing: -0.03em; text-transform: uppercase; text-shadow: 6px 6px 0 #f0a05a; }
    .row { flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 8px; font-family: Mono, monospace; font-size: 18px; }
    svg { width: 280px; height: 250px; background: #f7f1e4; border: 6px solid #24170f; shape-rendering: crispEdges; }
    .arrow { font-family: Mono, monospace; font-size: 28px; text-align: center; }
    .sub { margin: 0; font-size: 26px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="screen">
    <p class="hud"><span>MAAI901</span><span>EPOCH 01 → 40</span><span>20 OCT 2026</span></p>
    <h1>Autoencoders<br />&amp; VAEs</h1>
    <div class="row">
      <figure>
        <svg viewBox="0 0 16 14" aria-label="A noisy cat at the start of training">
          <rect width="16" height="14" fill="#d7c7a4" />
          <g fill="#8a7352">
            <rect x="1" y="2" width="3" height="2" /><rect x="5" y="1" width="2" height="3" /><rect x="9" y="3" width="4" height="2" />
            <rect x="3" y="6" width="2" height="2" /><rect x="8" y="7" width="5" height="2" /><rect x="2" y="10" width="6" height="2" />
          </g>
          <g fill="#e07a3d">
            <rect x="4" y="4" width="3" height="2" /><rect x="11" y="5" width="2" height="3" /><rect x="6" y="9" width="3" height="2" />
          </g>
          <g fill="#3f6b4e">
            <rect x="7" y="5" width="2" height="2" /><rect x="2" y="8" width="2" height="2" /><rect x="12" y="9" width="2" height="2" />
          </g>
        </svg>
        <figcaption>epoch 1 · mostly noise</figcaption>
      </figure>
      <p class="arrow">trains<br />→</p>
      <figure>
        <svg viewBox="0 0 16 14" aria-label="A crisp pixel cat after training">
          <rect width="16" height="14" fill="#f7f1e4" />
          <rect x="2" y="1" width="3" height="2" fill="#c46b3a" /><rect x="11" y="1" width="3" height="2" fill="#c46b3a" />
          <rect x="2" y="3" width="12" height="8" fill="#e8a15a" />
          <rect x="4" y="5" width="2" height="2" fill="#24170f" /><rect x="10" y="5" width="2" height="2" fill="#24170f" />
          <rect x="7" y="7" width="2" height="1" fill="#d24b3a" />
          <rect x="5" y="8" width="6" height="1" fill="#f3e2c4" />
          <rect x="3" y="11" width="2" height="2" fill="#e8a15a" /><rect x="11" y="11" width="2" height="2" fill="#e8a15a" />
        </svg>
        <figcaption>epoch 40 · a cat</figcaption>
      </figure>
    </div>
    <p class="sub">teaching a network to imagine cats · Danish · Tuesday 20 October 2026</p>
  </main>
</body>
</html>
