<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Seminar sheet — bottleneck</title>
  <style>
    @font-face { font-family: "Display"; font-weight: 700; font-style: normal; src: url("../fonts/NotoSerifDisplay-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Display"; font-weight: 700; font-style: italic; src: url("../fonts/NotoSerifDisplay-BoldItalic.ttf") format("truetype"); }
    @font-face { font-family: "Text"; font-weight: 400; src: url("../../site/vendor/fonts/inter-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Text"; font-weight: 600; src: url("../../site/vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Mono"; font-weight: 400; src: url("../../site/vendor/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      color: #1c1612;
      font-family: Text, sans-serif;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(28, 22, 18, 0.035) 28px),
        #f3ead7;
    }
    .sheet {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 36px 64px 28px 86px;
      border-left: 18px solid #b4332a;
    }
    header { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid #1c1612; padding-bottom: 10px; }
    .num { font-family: Display, serif; font-size: 42px; line-height: 1; }
    h1 { margin: 0; font-family: Display, serif; font-size: 42px; font-weight: 700; }
    .part { margin-left: auto; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }
    .figs {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 0.45fr 1.1fr;
      gap: 28px;
      align-items: center;
      margin-top: 18px;
    }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 10px; font-size: 18px; }
    figcaption strong { font-family: Mono, monospace; font-weight: 400; }
    .cat { width: 210px; height: 210px; }
    .slot {
      height: 280px;
      border-left: 3px solid #1c1612;
      border-right: 3px solid #1c1612;
      display: grid;
      place-items: center;
      font-family: Display, serif;
      font-size: 28px;
    }
    .caption {
      margin: 0;
      font-family: Display, serif;
      font-style: italic;
      font-size: 26px;
      max-width: 46ch;
    }
    .pencil {
      margin: 8px 0 0 auto;
      color: #b4332a;
      font-family: Display, serif;
      font-style: italic;
      font-size: 22px;
      transform: rotate(-0.6deg);
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header>
      <span class="num">6</span>
      <h1>The bottleneck</h1>
      <span class="part">Part 2 · Autoencoders</span>
    </header>
    <div class="figs">
      <figure>
        <svg class="cat" viewBox="0 0 120 120" aria-label="Input cat, drawn as a figure">
          <rect x="8" y="8" width="104" height="104" fill="none" stroke="#1c1612" stroke-width="1.5" />
          <path d="M30 48 L38 28 L52 44 M90 48 L82 28 L68 44" fill="none" stroke="#1c1612" stroke-width="2" />
          <ellipse cx="60" cy="66" rx="28" ry="24" fill="none" stroke="#1c1612" stroke-width="2" />
          <circle cx="50" cy="62" r="2.4" /><circle cx="70" cy="62" r="2.4" />
          <path d="M60 68 L56 76 L64 76 Z" fill="#1c1612" />
          <path d="M18 70 H36 M84 70 H102 M20 80 H34 M86 80 H100" stroke="#1c1612" stroke-width="1.4" />
        </svg>
        <figcaption>input · <strong>12,288</strong> numbers</figcaption>
      </figure>
      <div class="slot">k = 64</div>
      <figure>
        <svg class="cat" viewBox="0 0 120 120" aria-label="Rebuilt cat">
          <rect x="8" y="8" width="104" height="104" fill="none" stroke="#1c1612" stroke-width="1.5" />
          <path d="M32 50 L40 32 L52 46 M88 50 L80 32 L68 46" fill="none" stroke="#1c1612" stroke-width="2" />
          <ellipse cx="60" cy="68" rx="26" ry="22" fill="none" stroke="#1c1612" stroke-width="2" />
          <circle cx="51" cy="64" r="2.2" /><circle cx="69" cy="64" r="2.2" />
          <path d="M60 70 L57 76 L63 76 Z" fill="#1c1612" />
        </svg>
        <figcaption>built back · <strong>192×</strong> smaller code</figcaption>
      </figure>
    </div>
    <p class="caption">The network has to throw most of the picture away, then invent it back. 12,288 ÷ 64 = 192.</p>
    <p class="pencil">A linear version of this, trained with MSE, learns PCA’s subspace. The axes can still rotate.</p>
  </main>
</body>
</html>
