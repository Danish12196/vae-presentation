<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pixel training — bottleneck</title>
  <style>
    @font-face { font-family: "Poster"; font-weight: 700; src: url("../fonts/NotoSansDisplay-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Text"; font-weight: 400; src: url("../../site/vendor/fonts/inter-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Text"; font-weight: 600; src: url("../../site/vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Mono"; src: url("../../site/vendor/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #efe6d2; color: #24170f; font-family: Text, sans-serif; }
    .screen { height: 100%; padding: 22px 32px 16px; display: flex; flex-direction: column; border: 10px solid #24170f; }
    h1 { margin: 0; font-family: Poster, sans-serif; font-size: 48px; letter-spacing: -0.03em; text-transform: uppercase; }
    .row { flex: 1; display: grid; grid-template-columns: 1.1fr 0.7fr 1.1fr; gap: 16px; align-items: center; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 8px; font-family: Mono, monospace; font-size: 18px; }
    svg { background: #f7f1e4; border: 6px solid #24170f; shape-rendering: crispEdges; }
    .big { width: 250px; height: 220px; }
    .tiny { width: 132px; height: 132px; image-rendering: pixelated; }
    .soft { filter: blur(0.4px); }
    .eq { margin: 0; font-family: Mono, monospace; font-size: 22px; }
    .eq span { color: #9a3b22; }
  </style>
</head>
<body>
  <main class="screen">
    <h1>The bottleneck is fewer pixels</h1>
    <div class="row">
      <figure>
        <svg class="big" viewBox="0 0 16 14" aria-label="Crisp input cat">
          <rect width="16" height="14" fill="#f7f1e4" />
          <rect x="2" y="1" width="3" height="2" fill="#c46b3a" /><rect x="11" y="1" width="3" height="2" fill="#c46b3a" />
          <rect x="2" y="3" width="12" height="8" fill="#e8a15a" />
          <rect x="4" y="5" width="2" height="2" fill="#24170f" /><rect x="10" y="5" width="2" height="2" fill="#24170f" />
          <rect x="7" y="7" width="2" height="1" fill="#d24b3a" />
          <rect x="5" y="8" width="6" height="1" fill="#f3e2c4" />
        </svg>
        <figcaption>input · 12,288 numbers</figcaption>
      </figure>
      <figure>
        <svg class="tiny" viewBox="0 0 4 4" aria-label="The same cat kept as four by four blocks">
          <rect width="4" height="4" fill="#e0b07a" />
          <rect x="0" y="0" width="1" height="1" fill="#c46b3a" /><rect x="3" y="0" width="1" height="1" fill="#c46b3a" />
          <rect x="1" y="1" width="1" height="1" fill="#24170f" /><rect x="2" y="1" width="1" height="1" fill="#24170f" />
          <rect x="1" y="2" width="2" height="1" fill="#d9a06a" />
          <rect x="1" y="3" width="2" height="1" fill="#f3e2c4" />
        </svg>
        <figcaption>k = 64 · the code</figcaption>
      </figure>
      <figure>
        <svg class="big soft" viewBox="0 0 16 14" aria-label="A blurrier rebuilt cat">
          <rect width="16" height="14" fill="#f3e6d4" />
          <rect x="3" y="2" width="10" height="8" fill="#e4b483" />
          <rect x="4" y="5" width="2" height="2" fill="#6a5344" /><rect x="10" y="5" width="2" height="2" fill="#6a5344" />
          <rect x="7" y="7" width="2" height="2" fill="#c98a7a" />
        </svg>
        <figcaption>rebuilt · softer on purpose</figcaption>
      </figure>
    </div>
    <p class="eq">12,288 / 64 = <span>192</span> · MSE averages the sharp cats that could have fit</p>
  </main>
</body>
</html>
