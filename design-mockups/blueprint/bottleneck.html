<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Drawing office — bottleneck</title>
  <style>
    @font-face { font-family: "Sans"; font-weight: 700; src: url("../fonts/NotoSansDisplay-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Mono"; font-weight: 400; src: url("../../site/vendor/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Mono"; font-weight: 700; src: url("../../site/vendor/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      color: #e8f2ff;
      font-family: Mono, ui-monospace, monospace;
      background:
        linear-gradient(rgba(232, 242, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 242, 255, 0.07) 1px, transparent 1px),
        #0c2744;
      background-size: 32px 32px;
    }
    .sheet { height: 100%; padding: 28px 32px; display: grid; grid-template-rows: auto 1fr auto; }
    h1 { margin: 0; font-family: Sans, sans-serif; font-size: 36px; letter-spacing: 0.14em; }
    .meta { margin: 6px 0 0; color: #f0c14a; font-size: 14px; letter-spacing: 0.12em; }
    .elev { width: 100%; height: 100%; }
    table { border-collapse: collapse; font-size: 16px; }
    th, td { border: 1px solid rgba(232, 242, 255, 0.55); padding: 6px 14px; text-align: right; }
    th { text-align: left; font-weight: 400; letter-spacing: 0.08em; }
    tr.on td { color: #f0c14a; }
    .foot { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
    .note { max-width: 46ch; font-size: 16px; line-height: 1.4; }
  </style>
</head>
<body>
  <main class="sheet">
    <header>
      <h1>FIG. 6 · BOTTLENECK</h1>
      <p class="meta">PART 2 · ENCODER ELEVATION · LIVE k</p>
    </header>
    <svg class="elev" viewBox="0 0 1200 420" role="img" aria-label="Input block, a narrow latent, and the rebuilt block">

        <rect x="70" y="90" width="250" height="220" />
        <rect x="500" y="160" width="70" height="80" />
        <rect x="860" y="90" width="250" height="220" />
        <path d="M320 200 H500 M570 200 H860" />
        <path d="M488 188 L512 200 L488 212 M848 188 L872 200 L848 212" />
      </g>
      <g stroke="#f0c14a" fill="none" stroke-width="1.5">
        <path d="M500 150 V70 H570 V150" />
        <path d="M500 70 H570" />
      </g>
      <g fill="#e8f2ff" font-family="JetBrains Mono, monospace" font-size="18">
        <text x="195" y="200" text-anchor="middle">64×64×3</text>
        <text x="195" y="228" text-anchor="middle">12,288</text>
        <text x="535" y="206" text-anchor="middle">z</text>
        <text x="985" y="200" text-anchor="middle">64×64×3</text>
        <text x="985" y="228" text-anchor="middle">REBUILT</text>
      </g>
      <text x="535" y="58" text-anchor="middle" fill="#f0c14a" font-family="JetBrains Mono, monospace" font-size="18">k = 64</text>
      <text x="195" y="340" text-anchor="middle" fill="#e8f2ff" font-family="JetBrains Mono, monospace" font-size="14">INPUT</text>
      <text x="535" y="280" text-anchor="middle" fill="#e8f2ff" font-family="JetBrains Mono, monospace" font-size="14">LATENT</text>
      <text x="985" y="340" text-anchor="middle" fill="#e8f2ff" font-family="JetBrains Mono, monospace" font-size="14">OUTPUT</text>

    <div class="foot">
      <table>
        <tr><th>k</th><th>code</th><th>ratio</th></tr>
        <tr><td>2</td><td>2</td><td>6,144×</td></tr>
        <tr class="on"><td>64</td><td>64</td><td>192×</td></tr>
        <tr><td>256</td><td>256</td><td>48×</td></tr>
      </table>
      <p class="note">Amber marks the live setting. The decoder only learns codes it was shown. Empty regions of z are not on this drawing.</p>
    </div>
  </main>
</body>
</html>
